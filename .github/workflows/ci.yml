name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-gcc-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes liblua5.4-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMMO_WARNINGS_AS_ERRORS=ON
          -DMMO_ENABLE_LUA=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-clang-sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMMO_WARNINGS_AS_ERRORS=ON
          -DMMO_ENABLE_LUA=OFF
          -DMMO_ENABLE_ASAN=ON
          -DMMO_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DMMO_WARNINGS_AS_ERRORS=ON
          -DMMO_ENABLE_LUA=OFF
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
